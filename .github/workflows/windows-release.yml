name: Windows Release

on:
  push:
    tags:
      - 'win-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.2; leave blank to read from HermesHQ.Windows.csproj)'
        required: false
        default: ''
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Pin .NET SDK
        shell: pwsh
        run: |
          Copy-Item windows/global.json global.json
          dotnet --version

      - name: Resolve release version and tag
        id: meta
        shell: pwsh
        run: |
          $version = '${{ inputs.version }}'.Trim()
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
            $version = $tag -replace '^win-v', ''
          } else {
            if (-not $version) {
              [xml]$csproj = Get-Content windows/src/HermesHQ.Windows/HermesHQ.Windows.csproj
              $version = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1).Trim()
            }
            $version = $version -replace '^win-v', '' -replace '^v', ''
            $tag = "win-v$version"
          }
          if (-not ($version -match '^\d+\.\d+\.\d+')) {
            throw "Invalid version '$version'. Expected SemVer like 0.1.2."
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Hermes HQ for Windows $version (tag: $tag)"

      - name: Run unit tests
        run: dotnet test windows/HermesHQ.sln --filter "Category!=E2E" --logger "console;verbosity=minimal"

      - name: Publish win-x64
        run: dotnet publish windows/src/HermesHQ.Windows -c Release -r win-x64 -p:Platform=x64 -p:Version=${{ steps.meta.outputs.version }} -o dist/win-x64

      - name: Publish win-arm64
        run: dotnet publish windows/src/HermesHQ.Windows -c Release -r win-arm64 -p:Platform=ARM64 -p:Version=${{ steps.meta.outputs.version }} -o dist/win-arm64

      - name: Package archives and SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path dist/win-x64/* -DestinationPath release/HermesHQ-win-x64.zip -Force
          Compress-Archive -Path dist/win-arm64/* -DestinationPath release/HermesHQ-win-arm64.zip -Force
          $sums = @()
          foreach ($file in @('HermesHQ-win-x64.zip', 'HermesHQ-win-arm64.zip')) {
            $hash = (Get-FileHash -Path "release/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            $sums += "$hash  $file"
          }
          $sums -join "`n" | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-hq-windows-${{ steps.meta.outputs.version }}
          path: |
            release/HermesHQ-win-x64.zip
            release/HermesHQ-win-arm64.zip
            release/SHA256SUMS.txt
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          $version = '${{ steps.meta.outputs.version }}'
          $prerelease = '${{ inputs.prerelease }}' -eq 'true'
          $notes = @(
            "Hermes HQ for Windows **$version**",
            "",
            "### Easy Install / Update",
            "- **Already installed (v0.1.2+):** Open **Settings › About › Check for Updates** (or click **Check for Updates…** in the sidebar account menu) and choose **Install & Restart**.",
            "- **Fresh install or upgrading from v0.1.1:** Run in PowerShell:",
            '  ```powershell',
            '  irm https://raw.githubusercontent.com/mrcharlesiv/hermes-hq-app/main/windows/scripts/install-latest.ps1 | iex',
            '  ```',
            '- **Manual zip:** Download `HermesHQ-win-x64.zip` (or `HermesHQ-win-arm64.zip`) below, extract to a user-writable folder, and run `HermesHQ.exe`.'
          ) -join "`n"

          $exists = $true
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { $exists = $false }

          if ($exists) {
            gh release upload $tag release/HermesHQ-win-x64.zip release/HermesHQ-win-arm64.zip release/SHA256SUMS.txt --clobber
          } else {
            $ghArgs = @(
              'release', 'create', $tag,
              'release/HermesHQ-win-x64.zip',
              'release/HermesHQ-win-arm64.zip',
              'release/SHA256SUMS.txt',
              '--title', "Hermes HQ for Windows $version",
              '--notes', $notes
            )
            if ($prerelease) { $ghArgs += '--prerelease' }
            & gh @ghArgs
          }
