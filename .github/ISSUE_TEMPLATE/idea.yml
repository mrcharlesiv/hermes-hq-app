name: Idea
description: Something you'd like the app to do.
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: What you are trying to do, and how the app could help.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [iPhone, iPad, Mac, Add-on (Hermes plugin)]
