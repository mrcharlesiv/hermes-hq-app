name: Bug
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [iPhone, iPad, Mac, Add-on (Hermes plugin)]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build
      placeholder: e.g. 1.0.2 (923)
  - type: textarea
    id: more
    attributes:
      label: Screenshots or logs
      description: Please remove names, email addresses, chat text and hostnames first. Issues are public.
  - type: checkboxes
    id: cla
    attributes:
      label: Contributor License Agreement
      description: Issues often carry code, patches and other work that ends up in the app, so every issue needs this.
      options:
        - label: I have read the [Contributor License Agreement](https://github.com/mrcharlesiv/hermes-hq-app/blob/main/CLA.md) and agree that it covers any code, patch or other contribution I post in this issue and its comments.
          required: true
