            throw 'Cold launch requires the app to be stopped.'
          } else {
            $coldKey = $ready[0].Matches[0].Groups[1].Value
            $mark = @(Get-Content $appLog).Count
            Remove-Item Env:HQW_AUTOMATION -ErrorAction SilentlyContinue
            $invokeAt = [DateTime]::UtcNow
            $probe = Start-Process ./windows/build/reply-probe/ReplyProbe.exe -ArgumentList cold -PassThru -NoNewWindow -RedirectStandardOutput "$fix/cold-probe.out"
            if (-not $probe.WaitForExit(35000)) { $probe.Kill(); throw 'Cold reply probe timed out.' }
            $verdict = (Get-Content "$fix/cold-probe.out" -Raw).Trim()
            if ($probe.ExitCode -eq 2 -and $verdict.StartsWith('reply probe: gap: ')) {
              "cold launch: open gap: $verdict" | Tee-Object -FilePath $coldLog
            } elseif ($probe.ExitCode -ne 0 -or $verdict -cne 'reply probe: invoked') {
              throw "Cold reply probe failed ($($probe.ExitCode))."
            } else {
              for ($i = 0; $i -lt 60; $i++) {
                Start-Sleep -Milliseconds 500
                $new = @(Get-Content $appLog -ErrorAction SilentlyContinue | Select-Object -Skip $mark)
                $launched = ($new -match 'launched by a toast click \(Kind AppNotification\)') -and ($new -match ('fixture reply activation Cold ' + [regex]::Escape($stamp) + '$'))
                $opened = $new -match "toast cold launch opened chat key $coldKey$"
                if ($launched -and $opened) { break }
              }
              $relaunched = @(Get-Process HermesHQ -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe -and $_.StartTime.ToUniversalTime() -ge $invokeAt })
              if ($launched -and $opened -and $relaunched.Count -eq 1 -and (Test-Path "$shots/toast-cold-opened.png")) {
                "cold launch: verified new app, Kind AppNotification and loaded chat key $coldKey" | Tee-Object -FilePath $coldLog
              } elseif ($relaunched.Count -gt 0 -or $launched -or $opened) {
                throw 'Cold activation started but did not prove the intended fixture chat and its screenshot.'
              } else {
                'cold launch: open gap: shell invocation did not launch the unpackaged app' | Tee-Object -FilePath $coldLog
              }
              $relaunched | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
            }
          }
          Copy-Item "$env:LOCALAPPDATA/HermesHQ/logs/*" $shots -ErrorAction SilentlyContinue
          # [link-drop guard] AppState's '[rpc] link dropped' and 'listener threw' notes between the first composer walk
          # and the next extra's sign-in (WalkProof.LinkDrops): printed first, and the step fails on any.
          $linkDrops = @(); $inComposer = $false
          foreach ($line in @(Get-Content "$shots/hermes-hq.log.1", "$shots/hermes-hq.log" -ErrorAction SilentlyContinue)) {
            if ($line.Contains('[automation] composer walk ')) { $inComposer = $true }
            elseif ($inComposer -and ($line.Contains('[automation] signed in to ') -or $line.EndsWith('[automation] done'))) { $inComposer = $false }
            if ($inComposer -and ($line.Contains('[rpc] link dropped') -or $line.Contains('listener threw'))) { $linkDrops += $line }
          }
          Write-Host "--- link drops during the composer walks: $($linkDrops.Count)"; $linkDrops | ForEach-Object { Write-Host $_ }
          Write-Host "--- app log"; Get-Content "$shots/hermes-hq.log" -ErrorAction SilentlyContinue
          Write-Host "--- .pri files"; Get-ChildItem windows/build/app -Filter *.pri | Format-Table Name, Length
          Write-Host "--- Windows Application log errors (last 10 min)"
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Select-Object -First 6 | ForEach-Object { $_.TimeCreated; $_.ProviderName; $_.Message; "" }
          Stop-Process -Id $gw.Id -Force -ErrorAction SilentlyContinue
          $extraProcs | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          # Each stand-in's stderr: a socket loop that ended on anything but the app hanging up prints its exception and
          # traceback there ('[ws] socket loop ended: …'), the side of a '[rpc] link dropped' the app log can't see (WIN-29).
          foreach ($tag in @("perf") + @($extraDefs | ForEach-Object { $_.tag })) {
            $err = if ($tag -eq "perf") { "$fix/shots.err" } else { "$fix/shots-$tag.err" }
            Write-Host "--- stand-in $tag stderr"; Get-Content $err -ErrorAction SilentlyContinue
          }
          if ($linkDrops.Count -gt 0) { throw "The gateway link dropped (or a listener threw) during the composer walks." }
          if (!$quietOk) { throw 'Reply quiet-state check stopped; no cold invocation.' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path "$shots/automation.log")) { throw "The app did not finish the screenshot walk." }
          if ($warm.Count -ne 1 -or $banner.Count -ne 1) { throw 'Missing or duplicate notification verdicts.' }
          $warmResult = $warm[0].Matches[0].Groups[1].Value
          if ($warmResult -ceq 'NotificationInvoked opened chat A') {
            $before = @(Get-ChildItem "$shots/*-toast-before-reply.png"); $after = @(Get-ChildItem "$shots/*-toast-warm-opened.png")
            if ($before.Count -ne 1 -or $after.Count -ne 1) { throw 'Missing or ambiguous navigation screenshots.' }
            if ((Get-FileHash $before[0].FullName).Hash -eq (Get-FileHash $after[0].FullName).Hash) { throw 'Navigation screenshots did not change.' }
          } elseif (!$warmResult.StartsWith('open gap: ')) { throw 'Unexpected warm navigation verdict.' }
          @('### Notification proof', "- Warm: $warmResult", "- $(Get-Content $coldLog -Raw)", "- $($banner[0].Matches[0].Groups[1].Value)") >> $env:GITHUB_STEP_SUMMARY
          python windows/ci/check_walk_pngs.py $shots; if ($LASTEXITCODE -ne 0) { throw "Invalid screenshots." }
          $walk = Get-Content "$shots/automation.log"
          if (-not ($walk -match ' done$') -or ($walk -match ' failed:')) { throw "The screenshot walk did not finish cleanly." }
          if (Select-String -Path "$shots/hermes-hq.log" -SimpleMatch "couldn't open ") { throw "A place opened its error page." }
          foreach ($d in $extraDefs) {
            foreach ($place in $d.places) {
              if (-not (Test-Path "$shots/*-$($d.tag)-$place.png")) { throw "Missing screenshot: $($d.tag)-$place" }
            }
            foreach ($walk in @($d.walks | Where-Object { $_ })) {
              if (-not (Test-Path "$shots/*-$walk.png")) { throw "Missing screenshot: $walk" }
            }
            foreach ($shot in @($d.shots | Where-Object { $_ })) {
              if (-not (Test-Path "$shots/*-$shot.png")) { throw "Missing screenshot: $shot" }
            }
          }

      # [WIN-60] Larger text and high contrast: two more short app runs ("extrasOnly": straight to one walk) on their own
      # pages stand-ins, with the runner's Windows set first and always put back after (runner only).
      # text-scale (port 9863): HKCU\Software\Microsoft\Accessibility TextScaleFactor = 150. The walk wants
      # UISettings.TextScaleFactor 1.5, and on Chats, Tasks and Settings no text cut short where the Mac wraps it
      # (Hermes.Core/Shell/TextScaleWalkProof.cs). high-contrast (port 9864): a contrast theme on through
      # windows/ci/high-contrast.ps1 (SystemParametersInfo SPI_SETHIGHCONTRAST, SPIF_SENDCHANGE, not saved to the
      # profile), off again after. If Windows won't switch, high-contrast.log names the exact reason as an open gap and
      # that pass is skipped, never counted as a pass. Services/ProofWalks.TextScale.cs.
      - name: Larger text and high contrast
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && vars.HQW_DESKTOP_PROOF == '1'
        shell: pwsh
        run: |
          & ./windows/build/reply-probe/ReplyProbe.exe guard; if ($LASTEXITCODE -ne 0) { throw 'Desktop proof refused.' }
          $fix = "windows/build/fixtures"
          $exe = (Resolve-Path "windows/build/app/HermesHQ.exe").Path
          function Run-Pass($tag, $port, $walk, $shotNames) {
            $dir = (New-Item -ItemType Directory -Force "windows/build/shots/$tag").FullName
            Remove-Item "$fix/shots-$tag.json" -ErrorAction SilentlyContinue
            $gw = Start-Process python -ArgumentList "-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","$port","--files","$fix/shots-$tag-files","--task-lists","--tick-seconds","0","--credentials","$fix/shots-$tag.json" -PassThru -RedirectStandardOutput "$fix/shots-$tag.log" -RedirectStandardError "$fix/shots-$tag.err"
            try {
              for ($i = 0; $i -lt 100 -and -not (Test-Path "$fix/shots-$tag.json"); $i++) { Start-Sleep -Milliseconds 200 }
              if (-not (Test-Path "$fix/shots-$tag.json")) { Get-Content "$fix/shots-$tag.err" -Tail 20 -ErrorAction SilentlyContinue; throw "the $tag stand-in didn't start" }
              Start-Sleep -Seconds 1
              $c = Get-Content "$fix/shots-$tag.json" | ConvertFrom-Json
              if ($c.url -cne "http://127.0.0.1:$port") { throw "Wrong fixture for $tag" }
              $cfg = [pscustomobject]@{ shots = $dir; extrasOnly = $true; extras = @([pscustomobject]@{ url = $c.url; username = $c.username; password = $c.password; tag = $tag; places = @(); walks = @($walk) }) }
              $cfg | ConvertTo-Json -Depth 5 | Set-Content "$fix/automation-$tag.json"
              $env:HQW_AUTOMATION = (Resolve-Path "$fix/automation-$tag.json").Path
              $app = Start-Process $exe -PassThru
              if (-not $app.WaitForExit(300000)) { Stop-Process -Id $app.Id -Force; Write-Host "the $tag run didn't finish in 5 minutes" }
              Write-Host "$tag exit code: $($app.ExitCode)"
            } finally {
              Remove-Item Env:HQW_AUTOMATION -ErrorAction SilentlyContinue
              Stop-Process -Id $gw.Id -Force -ErrorAction SilentlyContinue
              Copy-Item "$env:LOCALAPPDATA/HermesHQ/logs/hermes-hq.log" "$dir/hermes-hq.log" -ErrorAction SilentlyContinue
            }
            Get-ChildItem $dir | Format-Table Name, Length
            if (-not (Test-Path "$dir/automation.log")) { throw "The $tag run left no automation.log." }
            Get-Content "$dir/automation.log"
            Select-String -Path "$dir/hermes-hq.log" -SimpleMatch "walk $walk" -ErrorAction SilentlyContinue | ForEach-Object { $_.Line }
            $log = Get-Content "$dir/automation.log"
            if ($app.ExitCode -ne 0 -or -not ($log -match ' done$') -or ($log -match ' failed:')) { throw "The $tag walk did not finish cleanly." }
            python windows/ci/check_walk_pngs.py $dir; if ($LASTEXITCODE -ne 0) { throw "Invalid $tag screenshots." }
            foreach ($shot in $shotNames) { if (-not (Test-Path "$dir/*-$shot.png")) { throw "Missing screenshot: $shot" } }
          }

          $acc = "HKCU:\Software\Microsoft\Accessibility"
          if (-not (Test-Path $acc)) { New-Item $acc | Out-Null }
          $before = (Get-ItemProperty $acc -Name TextScaleFactor -ErrorAction SilentlyContinue).TextScaleFactor
          Write-Host "TextScaleFactor before: $(if ($null -eq $before) { 'unset' } else { $before })"
          try {
            Set-ItemProperty $acc -Name TextScaleFactor -Value 150 -Type DWord
            Run-Pass "text-scale" 9863 "text-scale" @("text-scale-chat","text-scale-tasks","text-scale-settings","text-scale-foot")
          } finally {
            if ($null -eq $before) { Remove-ItemProperty $acc -Name TextScaleFactor -ErrorAction SilentlyContinue }
            else { Set-ItemProperty $acc -Name TextScaleFactor -Value $before -Type DWord }
            Write-Host "TextScaleFactor restored: $((Get-ItemProperty $acc -Name TextScaleFactor -ErrorAction SilentlyContinue).TextScaleFactor)"
          }

          $hcLog = (New-Item -ItemType Directory -Force "windows/build/shots").FullName + "/high-contrast.log"
          function Contrast($turn) {
            $p = Start-Process pwsh -ArgumentList "-NoProfile","-File","windows/ci/high-contrast.ps1","-Turn",$turn -PassThru -NoNewWindow -RedirectStandardOutput "$fix/contrast-$turn.out" -RedirectStandardError "$fix/contrast-$turn.err"
            if (-not $p.WaitForExit(60000)) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue; throw 'Contrast helper timed out.' }
            $said = @(Get-Content "$fix/contrast-$turn.out" -ErrorAction SilentlyContinue) + @(Get-Content "$fix/contrast-$turn.err" -ErrorAction SilentlyContinue) | Where-Object { $_ } | Select-Object -Last 1
            if ($p.ExitCode -eq 2 -and $said -match '^failed: SPI_(GET|SET)HIGHCONTRAST ') { return $said }
            if ($p.ExitCode -ne 0 -or $said -cnotin @('on','was on','off')) { throw "Unexpected contrast helper result ($($p.ExitCode))." }
            return $said
          }
          $state = Contrast "On"
          "high contrast: turn on: $state" | Tee-Object -FilePath $hcLog -Append
          if ($state -eq "on" -or $state -eq "was on") {
            Start-Sleep -Seconds 3   # the theme settles before the app starts
            try { Run-Pass "high-contrast" 9864 "high-contrast" @("high-contrast-chat","high-contrast-tasks","high-contrast-settings") }
            finally {
              if ($state -eq "on") {
                $restored = Contrast 'Off'
                "high contrast: turn off: $restored" | Tee-Object -FilePath $hcLog -Append
                if ($restored -ne 'off') { throw 'Did not restore the contrast state.' }
              }
            }
          } elseif ($state.StartsWith('failed: ')) {
            "high contrast: open gap: Windows didn't switch to a contrast theme ($state); no high-contrast pass ran" | Tee-Object -FilePath $hcLog -Append >> $env:GITHUB_STEP_SUMMARY
          } else { throw 'Invalid contrast transition.' }

      - uses: actions/upload-artifact@v4
        if: always() && runner.environment == 'github-hosted' && vars.HQW_DESKTOP_PROOF == '1'
        with:
          name: screenshots
          path: |
            windows/build/shots
            !windows/build/shots/**/*.dmp
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HermesHQ-win-x64
          path: windows/build/app

  # One push must explicitly request this proof. No repository setting grants it;
  # broad desktop proof may be unset or exactly 1. Any other value or a nonempty Narrator disable vetoes it.
  narrator-chat:
    if: >-
      github.event_name == 'push' && github.repository == 'mrcharlesiv/hermes-hq-windows' &&
      github.event.repository.full_name == github.repository && toJSON(github.event.repository.private) == 'true' &&
      github.ref == 'refs/heads/feat/windows' && github.event.ref == github.ref &&
      toJSON(github.event.deleted) == 'false' && github.event.after == github.sha && github.event.head_commit.id == github.sha &&
      startsWith(github.event.head_commit.message, fromJSON('"Proof: narrator-chat-only\n\nFrom feat/windows at "')) &&
      (vars.HQW_DESKTOP_PROOF == '' || vars.HQW_DESKTOP_PROOF == '1') && vars.HQW_NARRATOR_CHAT_DISABLE == ''
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit only the exact chat proof request
        run: python -B ci/narrator_chat_job.py admit
      - name: Publish the separate x64 chat fixture
        run: |
          dotnet restore src/HermesHQ.Windows -r win-x64 -p:Platform=x64 -p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $targets = (Resolve-Path ci/narrator-chat/Fixture.targets).Path
          dotnet publish src/HermesHQ.Windows -c Release -r win-x64 -p:Platform=x64 "-p:CustomAfterMicrosoftCommonTargets=$targets" --no-restore -o build/narrator-chat-app
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path -LiteralPath build/narrator-chat) { throw 'Refusing pre-existing Narrator evidence.' }
      - name: Observe the chat with the reviewed Narrator fixture
        id: walk
        run: |
          python -B ci/narrator_chat.py --disposable-narrator-chat
          exit $LASTEXITCODE
      - name: Verify the receipt even when the walk fails
        id: receipt
        if: ${{ !cancelled() && (steps.walk.outcome == 'success' || steps.walk.outcome == 'failure') }}
        run: |
          python -B ci/narrator_chat_job.py receipt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.receipt.outputs.bound == 'true' }}
        with:
          name: narrator-chat-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows/build/narrator-chat/result.json
          if-no-files-found: error
          retention-days: 1
