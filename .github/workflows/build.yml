name: Build and test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode 27 or newer
        run: |
          ls -d /Applications/Xcode*.app
          # The app needs Xcode 27.2 or later (README). Until GitHub's runners have it, skip with a notice.
          XCODE=$(ls -d /Applications/Xcode_2[7-9]*.app /Applications/Xcode_[3-9][0-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::notice::No Xcode 27 or later on this runner yet; build and tests skipped."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
            echo "Using $XCODE"
          fi
      - name: Generate the project
        if: env.SKIP != '1'
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Pick a simulator
        if: env.SKIP != '1'
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"].startswith("iPhone")))')
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$SIM"
      - name: Build
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          xcodebuild -project HermesHQNative.xcodeproj -scheme HermesHQNative -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build-for-testing -quiet 2>&1 | grep -v '^note:' | tail -200
      - name: Unit tests
        if: env.SKIP != '1'
        run: |
          set -o pipefail
          xcodebuild -project HermesHQNative.xcodeproj -scheme HermesHQNative -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO -only-testing:HermesHQNativeTests test-without-building \
            -quiet 2>&1 | grep -v '^note:' | tail -200
