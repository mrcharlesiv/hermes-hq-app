# The Windows build (copied to .github/workflows/ in the private CI mirror by windows/scripts/ci-sync.sh).
# Builds and tests Hermes.Core, runs the end-to-end walk against the stand-in gateways, builds the WinUI app, then
# runs it in automation mode (Services/Automation.cs) against a stand-in gateway and keeps a screenshot of every page.
name: windows
on:
  push:
    branches: [feat/windows]
permissions:
  contents: read
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name == 'push' && github.repository == 'mrcharlesiv/hermes-hq-windows' && github.event.repository.private == true && github.ref == 'refs/heads/feat/windows'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Fixture files (including HTML tiles) are UTF-8, independent of the runner's ANSI code page.
      PYTHONUTF8: '1'
      HQW_PRIVATE_MIRROR: ${{ toJSON(github.event.repository.private) }}
      HQW_DESKTOP_PROOF: ${{ vars.HQW_DESKTOP_PROOF }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      # The SDK pin lives in windows/global.json; the steps run from the repo root, so put a copy where dotnet looks.
      - name: Pin the .NET SDK
        shell: pwsh
        run: Copy-Item windows/global.json global.json; dotnet --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Core tests
        run: dotnet test windows/HermesHQ.sln --filter "Category!=E2E" --logger "console;verbosity=minimal"

      - name: End-to-end against the stand-in gateways
        shell: pwsh
        run: |
          $fix = "windows/build/fixtures"; New-Item -ItemType Directory -Force $fix | Out-Null
          $perf = Start-Process python -ArgumentList "windows/ci/fixtures/performance-fixture-gateway.py","--port","9715","--credentials","$fix/e2e-perf.json" -PassThru -RedirectStandardOutput "$fix/perf.log" -RedirectStandardError "$fix/perf.err"
          $nous = Start-Process python -ArgumentList "windows/ci/fixtures/nous-fixture-gateway.py","--port","9716","--portal-port","9717","--public-url","http://127.0.0.1:9716","--access-ttl","4" -PassThru -RedirectStandardOutput "$fix/nous.log" -RedirectStandardError "$fix/nous.err"
          $attach = Start-Process python -ArgumentList "windows/ci/fixtures/attachments-gateway.py","--port","9760","--credentials","$fix/e2e-attach.json","--files",(Join-Path (Resolve-Path $fix).Path "e2e-attach-files") -PassThru -RedirectStandardOutput "$fix/attach.log" -RedirectStandardError "$fix/attach.err"
          $gwa = Start-Process python -ArgumentList "windows/ci/fixtures/onboarding-gateway.py","--port","9740","--credentials","$fix/e2e-gw-a.json" -PassThru -RedirectStandardOutput "$fix/gwa.log" -RedirectStandardError "$fix/gwa.err"
          $gwb = Start-Process python -ArgumentList "windows/ci/fixtures/onboarding-gateway.py","--port","9741","--credentials","$fix/e2e-gw-b.json","--release-date","2026.9.10" -PassThru -RedirectStandardOutput "$fix/gwb.log" -RedirectStandardError "$fix/gwb.err"
          $composer = Start-Process python -ArgumentList "windows/ci/fixtures/composer-gateway.py","--port","9750","--credentials","$fix/e2e-composer.json" -PassThru -RedirectStandardOutput "$fix/composer.log" -RedirectStandardError "$fix/composer.err"
          $capabilities = Start-Process python -ArgumentList "windows/ci/fixtures/connectors-gateway.py","--port","9840","--credentials","$fix/e2e-capabilities.json" -PassThru -RedirectStandardOutput "$fix/capabilities.log" -RedirectStandardError "$fix/capabilities.err"
          $settings = Start-Process python -ArgumentList "windows/ci/fixtures/settings-gateway.py","--port","9830","--credentials","$fix/e2e-settings.json" -PassThru -RedirectStandardOutput "$fix/settings.log" -RedirectStandardError "$fix/settings.err"
          # [groups] The sidebar's group chat rows: the settings stand-in with two rooms in its mirror.
          $groups = Start-Process python -ArgumentList "windows/ci/fixtures/settings-gateway.py","--port","9831","--group-rooms","--credentials","$fix/e2e-groups.json" -PassThru -RedirectStandardOutput "$fix/groups.log" -RedirectStandardError "$fix/groups.err"
          # [groups] A room's management writes the bots and the mirror: its own --group-rooms stand-in (WIN-46).
          $groupmanage = Start-Process python -ArgumentList "windows/ci/fixtures/settings-gateway.py","--port","9832","--group-rooms","--credentials","$fix/e2e-groupmanage.json" -PassThru -RedirectStandardOutput "$fix/groupmanage.log" -RedirectStandardError "$fix/groupmanage.err"
          # [WIN-57] A room's Activity and its empty view (GroupActivityEndToEndTests): --quiet-room adds Quiet Room.
          $groupactivity = Start-Process python -ArgumentList "windows/ci/fixtures/settings-gateway.py","--port","9834","--group-rooms","--quiet-room","--credentials","$fix/e2e-groupactivity.json" -PassThru -RedirectStandardOutput "$fix/groupactivity.log" -RedirectStandardError "$fix/groupactivity.err"
          # [WIN-59] A room's @ list and a line for one member: its own --group-rooms stand-in (GroupMentionsEndToEndTests).
          $groupmentions = Start-Process python -ArgumentList "windows/ci/fixtures/settings-gateway.py","--port","9836","--group-rooms","--credentials","$fix/e2e-groupmentions.json" -PassThru -RedirectStandardOutput "$fix/groupmentions.log" -RedirectStandardError "$fix/groupmentions.err"
          # [WIN-ROWS-STEP-WALK] Held turns on one step each and one bot's slow open: its own settings stand-in (RowStepsEndToEndTests).
          $rowsteps = Start-Process python -ArgumentList "windows/ci/fixtures/settings-gateway.py","--port","9837","--credentials","$fix/e2e-rowsteps.json" -PassThru -RedirectStandardOutput "$fix/rowsteps.log" -RedirectStandardError "$fix/rowsteps.err"
          $botslist = Start-Process python -ArgumentList "windows/ci/fixtures/botslist-gateway.py","--port","9770","--hermes-cookies","--credentials","$fix/e2e-botslist.json" -PassThru -RedirectStandardOutput "$fix/botslist.log" -RedirectStandardError "$fix/botslist.err"
          $sessions = Start-Process python -ArgumentList "windows/ci/fixtures/sessions-gateway.py","--port","9771","--credentials","$fix/e2e-sessions.json" -PassThru -RedirectStandardOutput "$fix/sessions.log" -RedirectStandardError "$fix/sessions.err"
          $questions = Start-Process python -ArgumentList "windows/ci/fixtures/questions-gateway.py","--port","9730","--credentials","$fix/e2e-questions.json" -PassThru -RedirectStandardOutput "$fix/questions.log" -RedirectStandardError "$fix/questions.err"
          $insights = 0..3 | ForEach-Object { Start-Process python -ArgumentList "windows/ci/fixtures/morepages-gateway.py","--port","$(9871 + $_)","--credentials","$fix/e2e-insights-$_.json","--files","$fix/e2e-insights-files-$_","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/insights-$_.log" -RedirectStandardError "$fix/insights-$_.err" }
          $botpages = Start-Process python -ArgumentList "windows/ci/fixtures/morepages-gateway.py","--port","9870","--credentials","$fix/e2e-botpages.json","--files","$fix/e2e-botpages-files","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/botpages.log" -RedirectStandardError "$fix/botpages.err"
          $artifacts = Start-Process python -ArgumentList "windows/ci/fixtures/artifacts-gateway.py","--port","9820","--credentials","$fix/e2e-artifacts.json","--files","$fix/artifacts-files","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/artifacts.log" -RedirectStandardError "$fix/artifacts.err"
          $pages = Start-Process python -ArgumentList "-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9811","--credentials","$fix/e2e-pages.json","--files","$fix/pages-files" -PassThru -RedirectStandardOutput "$fix/pages.log" -RedirectStandardError "$fix/pages.err"
          # [walk proof] Tasks Sort By and Select: the pages stand-in with its lists, as the "tasks" screenshot extra runs it.
          $tasks = Start-Process python -ArgumentList "-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9815","--credentials","$fix/e2e-tasks.json","--files","$fix/tasks-files","--task-lists","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/tasks.log" -RedirectStandardError "$fix/tasks.err"
          # [WIN-42] Tasks › Goals and Today's Goals shelf: the pages stand-in with its five made-up goals and its lists.
          $goals = Start-Process python -ArgumentList "-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9818","--credentials","$fix/e2e-goals.json","--files","$fix/goals-files","--task-goals","--task-lists","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/goals.log" -RedirectStandardError "$fix/goals.err"
          # [kanban boards] The board picker past eight boards: 9 boards (the Boards list) and 13 (with its search).
          $boards9 = Start-Process python -ArgumentList "-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9812","--credentials","$fix/e2e-boards9.json","--files","$fix/boards9-files","--many-boards","9","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/boards9.log" -RedirectStandardError "$fix/boards9.err"
          $boards13 = Start-Process python -ArgumentList "-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9813","--credentials","$fix/e2e-boards13.json","--files","$fix/boards13-files","--many-boards","13","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/boards13.log" -RedirectStandardError "$fix/boards13.err"
          $workspace = Start-Process python -ArgumentList "windows/ci/fixtures/workspace-gateway.py","--port","9850","--credentials","$fix/e2e-workspace.json" -PassThru -RedirectStandardOutput "$fix/workspace.log" -RedirectStandardError "$fix/workspace.err"
          $jobs = Start-Process python -ArgumentList "windows/ci/fixtures/jobs-gateway.py","--port","9800","--credentials","$fix/e2e-jobs.json","--files","$fix/jobs-files","--tick-seconds","0" -PassThru -RedirectStandardOutput "$fix/jobs.log" -RedirectStandardError "$fix/jobs.err"
          for ($i = 0; $i -lt 100 -and -not ((Test-Path "$fix/e2e-perf.json") -and (Test-Path "$fix/e2e-questions.json") -and (Test-Path "$fix/e2e-attach.json") -and (Test-Path "$fix/e2e-gw-a.json") -and (Test-Path "$fix/e2e-gw-b.json") -and (Test-Path "$fix/e2e-composer.json") -and (Test-Path "$fix/e2e-botslist.json") -and (Test-Path "$fix/e2e-sessions.json") -and (Test-Path "$fix/e2e-jobs.json") -and (Test-Path "$fix/e2e-settings.json") -and (Test-Path "$fix/e2e-groups.json") -and (Test-Path "$fix/e2e-groupmanage.json") -and (Test-Path "$fix/e2e-groupactivity.json") -and (Test-Path "$fix/e2e-groupmentions.json") -and (Test-Path "$fix/e2e-rowsteps.json") -and (Test-Path "$fix/e2e-workspace.json") -and (Test-Path "$fix/e2e-pages.json") -and (Test-Path "$fix/e2e-tasks.json") -and (Test-Path "$fix/e2e-goals.json") -and (Test-Path "$fix/e2e-boards9.json") -and (Test-Path "$fix/e2e-boards13.json") -and (Test-Path "$fix/e2e-artifacts.json") -and (Test-Path "$fix/e2e-botpages.json") -and (Test-Path "$fix/e2e-insights-0.json") -and (Test-Path "$fix/e2e-insights-1.json") -and (Test-Path "$fix/e2e-insights-2.json") -and (Test-Path "$fix/e2e-insights-3.json") -and (Test-Path "$fix/e2e-capabilities.json")); $i++) { Start-Sleep -Milliseconds 200 }
          Start-Sleep -Seconds 1
          $missing = @("e2e-perf.json","e2e-questions.json","e2e-attach.json","e2e-gw-a.json","e2e-gw-b.json","e2e-composer.json","e2e-botslist.json","e2e-sessions.json","e2e-jobs.json","e2e-settings.json","e2e-groups.json","e2e-groupmanage.json","e2e-groupactivity.json","e2e-groupmentions.json","e2e-rowsteps.json","e2e-workspace.json","e2e-pages.json","e2e-tasks.json","e2e-goals.json","e2e-boards9.json","e2e-boards13.json","e2e-artifacts.json","e2e-botpages.json","e2e-insights-0.json","e2e-insights-1.json","e2e-insights-2.json","e2e-insights-3.json","e2e-capabilities.json") | Where-Object { -not (Test-Path "$fix/$_") }
          if ($missing) {
            Write-Host "stand-ins that didn't start: $missing"
            Get-ChildItem $fix -Filter *.err | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 30 }
            exit 1
          }
          $env:HQW_E2E_BOTSLIST = (Resolve-Path "$fix/e2e-botslist.json").Path
          $env:HQW_E2E_SESSIONS = (Resolve-Path "$fix/e2e-sessions.json").Path
          $env:HQW_E2E_JOBS_CREDENTIALS = (Resolve-Path "$fix/e2e-jobs.json").Path
          $env:HQW_E2E_COMPOSER_CREDENTIALS = (Resolve-Path "$fix/e2e-composer.json").Path
          $env:HQW_E2E_SETTINGS_CREDENTIALS = (Resolve-Path "$fix/e2e-settings.json").Path
          $env:HQW_E2E_GROUPS_CREDENTIALS = (Resolve-Path "$fix/e2e-groups.json").Path
          $env:HQW_E2E_GROUPMANAGE_CREDENTIALS = (Resolve-Path "$fix/e2e-groupmanage.json").Path
          $env:HQW_E2E_GROUPACTIVITY_CREDENTIALS = (Resolve-Path "$fix/e2e-groupactivity.json").Path
          $env:HQW_E2E_GROUPMENTIONS_CREDENTIALS = (Resolve-Path "$fix/e2e-groupmentions.json").Path
          $env:HQW_E2E_ROWSTEPS_CREDENTIALS = (Resolve-Path "$fix/e2e-rowsteps.json").Path
          $env:HQW_E2E_WORKSPACE_CREDENTIALS = (Resolve-Path "$fix/e2e-workspace.json").Path
          $env:HQW_E2E_PAGES_CREDENTIALS = (Resolve-Path "$fix/e2e-pages.json").Path
          $env:HQW_E2E_TASKS_CREDENTIALS = (Resolve-Path "$fix/e2e-tasks.json").Path
          $env:HQW_E2E_GOALS_CREDENTIALS = (Resolve-Path "$fix/e2e-goals.json").Path
          $env:HQW_E2E_BOARDS9_CREDENTIALS = (Resolve-Path "$fix/e2e-boards9.json").Path
          $env:HQW_E2E_BOARDS13_CREDENTIALS = (Resolve-Path "$fix/e2e-boards13.json").Path
          $env:HQW_E2E_ARTIFACTS_CREDENTIALS = (Resolve-Path "$fix/e2e-artifacts.json").Path
          $env:HQW_E2E_BOTPAGES_CREDENTIALS = (Resolve-Path "$fix/e2e-botpages.json").Path
          $env:HQW_E2E_CAPABILITIES_CREDENTIALS = (Resolve-Path "$fix/e2e-capabilities.json").Path
          $env:HQW_E2E_GW_A = (Resolve-Path "$fix/e2e-gw-a.json").Path
          $env:HQW_E2E_GW_B = (Resolve-Path "$fix/e2e-gw-b.json").Path
          $env:HQW_E2E_ATTACH_CREDENTIALS = (Resolve-Path "$fix/e2e-attach.json").Path
          $env:HQW_E2E_QUESTIONS_CREDENTIALS = (Resolve-Path "$fix/e2e-questions.json").Path
          $env:HQW_E2E_CREDENTIALS = (Resolve-Path "$fix/e2e-perf.json").Path
          $env:HQW_E2E_NOUS_URL = "http://127.0.0.1:9716"
          $env:HQW_E2E_INSIGHTS_STATUS = (Resolve-Path "$fix/e2e-insights-0.json").Path
          $env:HQW_E2E_INSIGHTS_SPAWN = (Resolve-Path "$fix/e2e-insights-1.json").Path
          $env:HQW_E2E_INSIGHTS_STARMAP = (Resolve-Path "$fix/e2e-insights-2.json").Path
          $env:HQW_E2E_INSIGHTS_TILES = (Resolve-Path "$fix/e2e-insights-3.json").Path
          dotnet test windows/HermesHQ.sln --filter "Category=E2E" --logger "console;verbosity=normal"
          $code = $LASTEXITCODE
          Stop-Process -Id $perf.Id, $nous.Id, $questions.Id, $attach.Id, $gwa.Id, $gwb.Id, $composer.Id, $botslist.Id, $sessions.Id, $jobs.Id, $settings.Id, $groups.Id, $groupmanage.Id, $groupactivity.Id, $groupmentions.Id, $rowsteps.Id, $workspace.Id, $pages.Id, $tasks.Id, $goals.Id, $boards9.Id, $boards13.Id, $artifacts.Id, $botpages.Id, $capabilities.Id -Force -ErrorAction SilentlyContinue
          $insights | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
          exit $code

      - name: Build the app
        run: dotnet publish windows/src/HermesHQ.Windows -c Release -r win-x64 -p:Platform=x64 -o windows/build/app

      - name: Compile the reply-only shell probe
        run: dotnet publish windows/tools/reply-probe -c Release -r win-x64 --self-contained false -o windows/build/reply-probe

      - name: Full desktop safety contracts
        shell: pwsh
        run: |
          python windows/tests/test_desktop_proof.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/tests/test_reply_evidence.py; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows/tests/test_toast_quiet.py; exit $LASTEXITCODE

      - name: Desktop proof not opted in
        if: vars.HQW_DESKTOP_PROOF != '1'
        run: Write-Output '::notice::Open gap - no desktop walks or desktop screenshots on this run.'

      - name: Run the app and take screenshots
        if: runner.os == 'Windows' && runner.environment == 'github-hosted' && vars.HQW_DESKTOP_PROOF == '1'
        env:
          HQW_QUIET_PUSH: ${{ format('{0}|{1}|{2}|{3}|{4}|{5}', github.event.repository.full_name, toJSON(github.event.repository.private), toJSON(github.event.repository.fork), github.event.ref, github.event.after, toJSON(github.event.deleted)) }}
        shell: pwsh
        run: |
          & ./windows/build/reply-probe/ReplyProbe.exe guard toasts; if ($LASTEXITCODE -ne 0) { throw 'Desktop proof refused.' }
          if ((Test-Path "$env:LOCALAPPDATA/HermesHQ") -or (Get-Process HermesHQ -ErrorAction SilentlyContinue)) { throw 'Refusing an existing app profile or process.' }
          if (Test-Path "windows/build/shots") { throw 'Refusing a pre-existing screenshot directory.' }
          $fix = "windows/build/fixtures"; $shots = (New-Item -ItemType Directory "windows/build/shots").FullName
          Remove-Item "$fix/shots-perf.json" -ErrorAction SilentlyContinue
          $gw = Start-Process python -ArgumentList "windows/ci/fixtures/performance-fixture-gateway.py","--port","9711","--credentials","$fix/shots-perf.json" -PassThru -RedirectStandardOutput "$fix/shots.log" -RedirectStandardError "$fix/shots.err"
          for ($i = 0; $i -lt 100 -and -not (Test-Path "$fix/shots-perf.json"); $i++) { Start-Sleep -Milliseconds 200 }
          Start-Sleep -Seconds 1
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:9711/__fixture/history -ContentType application/json -Body '{"profile":"default","count":40}' | Out-Null
          Invoke-RestMethod -Method Post -Uri http://127.0.0.1:9711/__fixture/plan -ContentType application/json -Body '{"plans":[{"chunks":["Let me ","run ","three steps. ","All **done**.\n\n```python\nprint(\"hi\")\n```"],"tools":3,"toolBytes":64}]}' | Out-Null
          # Stand-ins with each page's own data, visited after the performance walk (Automation "extras").
          $env:HQN_MOREPAGES_ANY_PORT = "1"
          $extraDefs = @(
            # [walk proof] Ctrl+Shift+N: the New Chat sheet, Research and its project Reading picked by keyboard (the stand-in
            # records session.create for Research in /home/hermes/reading), the new chat open with the keyboard in its box.
            @{ tag = "sessions"; args = @("windows/ci/fixtures/sessions-gateway.py","--port","9771"); places = @("sessions"); walks = @("new-chat-sheet","new-chat-here","sessions-working-chip"); shots = @("new-chat-sheet-started","new-chat-here-project","new-chat-here-home","new-chat-here-bot","sessions-working-chip","sessions-working-chip-narrow") },
            # [walk proof] Quick Actions' Run Job tile (Morning inbox triage, saved as the list first): the stand-in records its
            # one trigger for inbox and the page says "✓ Running Morning inbox triage".
            @{ tag = "jobs"; args = @("windows/ci/fixtures/jobs-gateway.py","--port","9800","--files","$fix/shots-jobs-files","--tick-seconds","0"); places = @("jobs"); walks = @("quick-action-run") },
            # [walk proof] Ctrl+Shift+K: Quick Actions' starter set; Edit, Move Down, a − badge, Done (quick-actions.json saved in
            # that order); then the Add Task tile opens the Tasks page. [WIN-08] kanban-task-markdown: three Release 2.4
            # task panels with their description, comments and Result drawn as Markdown, and Edit showing the raw text.
            @{ tag = "pages"; args = @("-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9811","--files","$fix/shots-pages-files"); places = @("kanban","tasks"); walks = @("quick-actions","kanban-task-markdown"); shots = @("quick-actions-editing","quick-actions-edit","kanban-task-markdown-edit","kanban-task-markdown-comments","kanban-task-markdown-result") },
            # [kanban boards] The board picker: 8 boards are its menu, 9 the Boards list, 13 the list searched for "plan".
            @{ tag = "boards8"; args = @("-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9814","--files","$fix/shots-boards8-files","--many-boards","8","--tick-seconds","0"); places = @("kanban"); walks = @("kanban-boards-menu") },
            @{ tag = "boards9"; args = @("-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9812","--files","$fix/shots-boards9-files","--many-boards","9","--tick-seconds","0"); places = @("kanban"); walks = @("kanban-boards-list") },
            @{ tag = "boards13"; args = @("-X","utf8","windows/ci/fixtures/pages-fixture-gateway.py","--port","9813","--files","$fix/shots-boards13-files","--many-boards","13","--tick-seconds","0"); places = @("kanban"); walks = @("kanban-boards-search") },
            # [walk proof] File and page windows: the release page and a Markdown note opened as a chat's file click opens
            # them, each in a window of its own (its bar: Open in…, Share…, Save As…); the page again brings its window
            # forward (no new one); Ctrl+W closes it and the main window keeps Project notes. Services/ProofWalks.Windows.cs.
            @{ tag = "artifacts"; args = @("windows/ci/fixtures/artifacts-gateway.py","--port","9820","--files","$fix/shots-artifacts-files","--tick-seconds","0"); places = @("artifacts"); walks = @("file-windows"); shots = @("file-windows-page","file-windows-note") },
            @{ tag = "workspace"; args = @("windows/ci/fixtures/workspace-gateway.py","--port","9850"); places = @("files","review","terminal") },
            @{ tag = "capabilities"; args = @("windows/ci/fixtures/connectors-gateway.py","--port","9840"); places = @("capabilities","marketplace") },
            @{ tag = "star-first"; args = @("windows/ci/fixtures/morepages-gateway.py","--port","9875","--files","$fix/shots-star-first-files","--tick-seconds","0"); places = @(); walks = @("star-map-first-open"); shots = @("star-map-first-seeded","star-map-first-error","star-map-first-empty","star-map-first-unsupported","star-map-first-bare") },
            @{ tag = "more"; args = @("windows/ci/fixtures/morepages-gateway.py","--port","9870","--files","$fix/shots-more-files","--tick-seconds","0"); places = @("profiles","messaging","webhooks","import-sessions","command-center","usage","spawn-tree","star-map","tiles") },
            # [walk proof] /new in a chat (the stand-in records no prompt), then Ctrl+/ and Esc; Auto-Archive on with 14 days
            # (the stand-in records the PUT /api/config). Services/ProofWalks.cs.
            # Then Ctrl+K (Recent, a bot's results, ↓ and Enter, no results), Ctrl+F in Trip planning ("food", F3), letters
            # typed with the transcript focused; and on the pages stand-in with its lists, ⋯ › Sort By › Due Date (the
            # stand-in records the PUT /tasks/settings) and Select with two rows picked. "shots": the walks' other pictures.
            # The sidebar's Search clicked open and folded into the rail (Open Quickly from each); Settings › About, its
            # licences and one notice; Settings search "verbose", Detailed Logging off and on by keyboard against the app log.
            # Quick Actions' Send a Message tile with Open the Chat on: the bot's chat opens and the stand-in records the words.
            # Window keys: Ctrl+R on Sessions (the stand-in records a second GET of the list) and Ctrl+Down to its first row;
            # Ctrl+Down through the bots until it stops, Ctrl+Up back; Ctrl+3 then Ctrl+1 brings the bot's chat back; the
